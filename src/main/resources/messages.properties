# Friendly text for binding failures, which Spring reports with a code of
# typeMismatch[.objectName][.field] and an otherwise very technical default
# message. Field validators pass their own message inline and fall through
# these lookups unchanged.
typeMismatch.effortEstimate=Effort estimate must be a number
typeMismatch.effortLogged=Logged effort must be a number
typeMismatch=Enter a valid value
